<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Pujo Parikrama app icon: a dhak, hung sideways the way dhakis carry it, crowned with white kash-phool
       plumes, on deep sindoor red framed by a laal-paar (white + gold) border. Key shapes stay in the central 80%. -->
  <defs>
    <radialGradient id="ground" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#D7263D"/><stop offset=".6" stop-color="#9F1239"/><stop offset="1" stop-color="#5B0A14"/>
    </radialGradient>
    <linearGradient id="body" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#F59E0B"/><stop offset=".45" stop-color="#C2410C"/><stop offset="1" stop-color="#7C2D12"/>
    </linearGradient>
    <radialGradient id="skin" cx="40%" cy="40%" r="70%">
      <stop offset="0" stop-color="#FFFBEB"/><stop offset=".7" stop-color="#F5E1B5"/><stop offset="1" stop-color="#C9A063"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#C99A12"/></linearGradient>
    <g id="plume">
      <path d="M0 0 C -26 -44 -30 -104 -8 -150 C 2 -118 4 -112 8 -150 C 30 -104 26 -44 0 0 Z" fill="#FFFFFF"/>
      <path d="M0 -4 C -3 -52 -3 -100 1 -142" fill="none" stroke="#E7DCC4" stroke-width="3"/>
    </g>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2B0006" flood-opacity=".45"/></filter>
  </defs>
  <rect width="512" height="512" fill="#FFF8EC"/>
  <rect x="14" y="14" width="484" height="484" rx="62" fill="#D4A017"/>
  <rect x="24" y="24" width="464" height="464" rx="54" fill="url(#ground)"/>
  <!-- kash plumes, fanned -->
  <g transform="translate(256 236)" filter="url(#soft)">
    <use href="#plume" transform="rotate(-44) scale(.92)"/>
    <use href="#plume" transform="rotate(-22)"/>
    <use href="#plume" transform="rotate(22)"/>
    <use href="#plume" transform="rotate(44) scale(.92)"/>
    <use href="#plume" transform="scale(1.12)"/>
  </g>
  <!-- the dhak on its side: barrel body, laced in gold, skin facing left -->
  <g transform="translate(262 326)" filter="url(#soft)">
    <path d="M-120 -78 C -60 -96 60 -96 120 -78 C 138 -40 138 40 120 78 C 60 96 -60 96 -120 78 Z" fill="url(#body)"/>
    <path d="M-100 -82 L -40 86 M -40 -90 L 20 90 M 20 -90 L 80 86 M 80 -86 L 120 30 M -100 -82 L -120 -20
             M 100 -82 L 40 86 M 40 -90 L -20 90 M -20 -90 L -80 86 M -80 -86 L -120 30" stroke="#FDE68A" stroke-width="5" stroke-opacity=".7" fill="none"/>
    <ellipse cx="-122" cy="0" rx="30" ry="80" fill="url(#gold)"/>
    <ellipse cx="-126" cy="0" rx="24" ry="72" fill="url(#skin)"/>
    <ellipse cx="122" cy="0" rx="22" ry="80" fill="url(#gold)"/>
  </g>
  <!-- the dhaki's stick -->
  <path d="M 70 430 C 110 400 140 380 168 352" fill="none" stroke="#FDE68A" stroke-width="10" stroke-linecap="round"/>
  <circle cx="170" cy="350" r="9" fill="#FDE68A"/>
</svg>
