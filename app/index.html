<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pujo Parikrama 2026</title>
  <meta name="description" content="Plan your Durga Puja 2026 pandal hopping in Kolkata: zones, live check-ins, food, parking, routes, moments and a step tracker.">
  <meta name="theme-color" content="#9F1239">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/></symbol>
      <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4 3 6.5v13.5L9 17.5l6 2.5 6-2.5V4l-6 2.5L9 4Z"/><path d="M9 4v13.5M15 6.5V20"/></symbol>
      <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.6 4-5 7-5s5.8 1.4 7 5"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16.5 9.5"/></symbol>
      <symbol id="i-food" viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0Z"/><path d="M8 7c0-2 2-2 2-4M12 7c0-2 2-2 2-4"/></symbol>
      <symbol id="i-car" viewBox="0 0 24 24"><path d="M5 16V11l2-5h10l2 5v5"/><path d="M3.5 16h17v3h-17z"/><circle cx="7.5" cy="13.5" r=".8"/><circle cx="16.5" cy="13.5" r=".8"/></symbol>
      <symbol id="i-metro" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M8 21l2-4M16 21l-2-4"/><circle cx="9" cy="14" r=".8"/><circle cx="15" cy="14" r=".8"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-steps" viewBox="0 0 24 24"><path d="M8 3c2 0 3 2 3 5s-1 5-3 5-3-2-3-5 1-5 3-5ZM6 15h4v2a2 2 0 0 1-4 0zM16 7c2 0 3 2 3 5s-1 5-3 5-3-2-3-5 1-5 3-5ZM14 19h4v.5a2 2 0 0 1-4 0z"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 13v7h14v-7"/></symbol>
      <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m4 18 5-5 4 4 3-3 4 4"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
      <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 19c.8-3 3.2-4.5 6-4.5s5.2 1.5 6 4.5M15 14.6c2.6-.3 4.8.9 5.6 3.9"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.8z"/></symbol>
      <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="1.8"/><path d="M9 21l2-6 3 2v5M8 12l3-4 3 3 3 1M11 8l-3 1-1 3"/></symbol>
    </defs>
  </svg>

  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="icons/icon.svg" alt="" width="34" height="34">
      <div>
        <h1>Pujo Parikrama</h1>
        <p id="countdown" class="sub">Durga Puja 2026 · Kolkata</p>
      </div>
    </div>
    <button class="lang-btn" id="langBtn" type="button" aria-label="Switch to Bengali">বাংলা</button>
    <label class="day-pick">
      <span class="sr-only">Puja day</span>
      <select id="daySelect" aria-label="Puja day"></select>
    </label>
  </header>

  <main id="main">
    <section id="view-home" class="view active" aria-labelledby="tab-home"></section>
    <section id="view-explore" class="view" aria-labelledby="tab-explore">
      <div class="map-wrap">
        <div id="map" class="map" role="region" aria-label="Map"></div>
        <button class="fab-sm" id="locateBtn" aria-label="Show my location"><svg class="ic"><use href="#i-locate"/></svg></button>
      </div>
      <div class="panel" id="explorePanel"></div>
    </section>
    <section id="view-plan" class="view" aria-labelledby="tab-plan"></section>
    <section id="view-moments" class="view" aria-labelledby="tab-moments"></section>
    <section id="view-me" class="view" aria-labelledby="tab-me"></section>
  </main>

  <button class="fab" id="fabAdd" type="button" hidden aria-label="Add a moment"><svg class="ic"><use href="#i-camera"/></svg></button>

  <nav class="tabbar" aria-label="Sections">
    <button class="tab active" id="tab-home" data-view="home"><svg class="ic"><use href="#i-home"/></svg><span data-i18n="tab.home">Home</span></button>
    <button class="tab" id="tab-explore" data-view="explore"><svg class="ic"><use href="#i-map"/></svg><span data-i18n="tab.explore">Explore</span></button>
    <button class="tab" id="tab-plan" data-view="plan"><svg class="ic"><use href="#i-route"/></svg><span data-i18n="tab.plan">Plan</span></button>
    <button class="tab" id="tab-moments" data-view="moments"><svg class="ic"><use href="#i-camera"/></svg><span data-i18n="tab.moments">Moments</span></button>
    <button class="tab" id="tab-me" data-view="me"><svg class="ic"><use href="#i-user"/></svg><span data-i18n="tab.me">Me</span></button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true" tabindex="-1">
    <div class="sheet-grip" aria-hidden="true"></div>
    <button class="sheet-close" id="sheetClose" aria-label="Close">×</button>
    <div id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="pickCamera" accept="image/*,video/*" capture="environment" hidden>
  <input type="file" id="pickGallery" accept="image/*,video/*" hidden>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
