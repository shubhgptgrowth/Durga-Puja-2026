[[story]]
slug = "durga-puja-day-by-day"
music = "story_dhak"
title = "Durga Puja 2026, day by day"
dek = "From Mahalaya to Bijoya Dashami: what happens on each day, in photos."
article = "durga-puja/rituals/"
cover = "pushpanjali"
  [[story.pages]]
  image = "mahalaya"
  kicker = "Saturday 10 October"
  heading = "Mahalaya"
  text = "At dawn, families offer tarpan to their ancestors at the river and the radio plays Mahishasuramardini. The fortnight of the goddess begins."
  link = "durga-puja/rituals/mahalaya/"
  [[story.pages]]
  image = "bodhon"
  kicker = "Saturday 17 October"
  heading = "Shashthi: the awakening"
  text = "In the evening the goddess is awakened in the bodhon rite, and the pandals open."
  link = "durga-puja/rituals/shashthi/"
  [[story.pages]]
  image = "kola-bou"
  kicker = "Sunday 18 October"
  heading = "Saptami: Kola Bou"
  text = "At dawn the Kola Bou, nine plants tied together as the goddess, is bathed and dressed in a sari. Then the goddess is invoked into the image."
  link = "durga-puja/rituals/kola-bou/"
  [[story.pages]]
  image = "pushpanjali"
  kicker = "Monday 19 October"
  heading = "Maha Ashtami"
  text = "The pandals fill for pushpanjali, flowers offered with mantras. Many pujas hold Kumari Puja, and Sandhi Puja marks the junction with Navami."
  link = "durga-puja/rituals/ashtami/"
  [[story.pages]]
  image = "sandhi-puja"
  kicker = "Ashtami into Navami"
  heading = "Sandhi Puja"
  text = "In the 48 minutes where Ashtami ends and Navami begins, the goddess is worshipped as Chamunda with 108 lotuses and 108 lamps."
  link = "durga-puja/rituals/sandhi-puja/"
  [[story.pages]]
  image = "dhunuchi"
  kicker = "Tuesday 20 October"
  heading = "Maha Navami"
  text = "The last full day of worship: the homa fire offering, khichuri bhog, and dhunuchi dances to the dhak late into the night."
  link = "durga-puja/rituals/navami/"
  [[story.pages]]
  image = "sindoor-khela"
  kicker = "Wednesday 21 October"
  heading = "Bijoya Dashami"
  text = "Women offer sindoor to the goddess and smear it on each other's faces: sindoor khela, the vermilion farewell."
  link = "durga-puja/rituals/sindoor-khela/"
  [[story.pages]]
  image = "immersion"
  heading = "Until next year"
  text = "The goddess is carried to the river and immersed. Then everyone embraces, touches elders' feet and says Shubho Bijoya."
  link = "durga-puja/rituals/dashami/"

[[story]]
slug = "maha-ashtami"
music = "story_dhak"
title = "Maha Ashtami: the heart of Durga Puja"
dek = "Anjali, Kumari Puja and Sandhi Puja: the biggest day of the puja, in photos."
article = "durga-puja/rituals/ashtami/"
cover = "sandhi-puja"
  [[story.pages]]
  image = "pushpanjali"
  kicker = "Morning"
  heading = "Pushpanjali"
  text = "People stand in rows with flowers and bel leaves, repeat the Sanskrit mantras after the priest, usually in three rounds, and offer the flowers at the goddess's feet."
  link = "durga-puja/rituals/pushpanjali-mantra/"
  [[story.pages]]
  image = "kumari-puja"
  kicker = "Kumari Puja"
  heading = "A girl worshipped as the goddess"
  text = "In many pujas a young girl is bathed, dressed in a red sari and worshipped as a living form of Durga. The best known is at Belur Math."
  link = "durga-puja/rituals/kumari-puja/"
  [[story.pages]]
  image = "sandhi-puja"
  kicker = "The junction"
  heading = "Sandhi Puja"
  text = "Where Ashtami meets Navami: 108 lotuses, 108 lamps and the dhak at its most intense. It can fall at any hour, so check your panjika."
  link = "durga-puja/rituals/sandhi-puja/"
  [[story.pages]]
  image = "saree"
  kicker = "What people wear"
  heading = "The best new clothes"
  text = "Ashtami is the day for the finest outfit of the puja: a silk or handloom sari, a dhoti or panjabi, and shoes you can slip off at the altar."
  link = "durga-puja/what-to-wear/"
  [[story.pages]]
  image = "dhunuchi"
  kicker = "Evening"
  heading = "Aarti and dhunuchi"
  text = "After the evening aarti, many pujas break into dhunuchi naach, the dance with smoking clay incense burners."
  link = "durga-puja/rituals/dhunuchi-naach/"
  [[story.pages]]
  image = "crowd"
  kicker = "Plan ahead"
  heading = "The most crowded day"
  text = "Ashtami and Navami bring the biggest crowds: long anjali queues in the morning and packed pandals until well past midnight."
  link = "durga-puja/pandal-hopping-tips/"

