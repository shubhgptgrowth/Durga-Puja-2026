[[story]]
slug = "history-of-durga-puja"
music = "story_sitar"
title = "Three centuries of Durga Puja in Bengal"
dek = "From the courtyards of rajas to the streets of a whole city."
article = "durga-puja/history/"
cover = "history"
  [[story.pages]]
  image = "durga-painting"
  kicker = "1500s–1700s"
  heading = "The pujas of rajas"
  text = "The grand autumn puja took shape among landholders and kings, among them Raja Krishnachandra Roy of Nadia. Many early dates come from family tradition."
  [[story.pages]]
  image = "bonedi-bari"
  kicker = "1757"
  heading = "Sovabazar Rajbari"
  text = "Raja Nabakrishna Deb's puja in north Kolkata, traditionally dated to the year of Plassey. Its thakurdalan still holds the puja."
  link = "durga-puja/bonedi-bari-pujas/"
  [[story.pages]]
  image = "history"
  kicker = "Colonial Calcutta"
  heading = "The babus' pujas"
  text = "Merchant families competed in splendour, inviting Company officials and hiring famous singers. These houses are today's bonedi bari."
  [[story.pages]]
  image = "crowd"
  kicker = "Around 1790"
  heading = "Barowari: twelve friends"
  text = "At Guptipara, by tradition, twelve friends pooled money for a puja of their own: the first puja owned by a group, not a family."
  [[story.pages]]
  image = "family"
  kicker = "1910 onward"
  heading = "Sarbojanin: for everyone"
  text = "Neighbourhood committees began pujas open to all, regardless of caste or means. Bagbazar Sarbojanin dates to 1918 or 1919."
  [[story.pages]]
  image = "kumartuli"
  kicker = "Mid-1900s"
  heading = "A city of pujas"
  text = "New neighbourhoods built their own pujas after independence, and Kumartuli's potters made images for all of them."
  link = "durga-puja/kumartuli-idol-making/"
  [[story.pages]]
  image = "pandal-art"
  kicker = "1980s–2000s"
  heading = "The theme pandal"
  text = "Pandals became public art, each built around one idea: a village craft, a social issue or an imagined world."
  link = "durga-puja/pandal-art-and-themes/"
  [[story.pages]]
  image = "unesco"
  kicker = "December 2021"
  heading = "World heritage"
  text = "UNESCO inscribed Durga Puja in Kolkata on its list of the Intangible Cultural Heritage of Humanity."
  link = "durga-puja/unesco-heritage/"

[[story]]
slug = "kumartuli-idol-making"
music = "story_sitar"
title = "How Kumartuli makes the goddess"
dek = "Bamboo, straw, river clay and paint: the making of a Durga image."
article = "durga-puja/kumartuli-idol-making/"
cover = "kumartuli"
  [[story.pages]]
  image = "kumartuli"
  heading = "The potters' quarter"
  text = "On the bank of the Hooghly in north Kolkata, hundreds of artisans make the images for the city's pujas and for pujas abroad."
  [[story.pages]]
  image = "kumartuli-2"
  heading = "Layer by layer"
  text = "Each image is built on a bamboo and wood frame, shaped in straw, covered in layers of river clay, dried, then painted and dressed."
  [[story.pages]]
  image = "family"
  heading = "The eyes, last"
  text = "Chokkhu daan, painting the goddess's eyes, is the final step, traditionally done around Mahalaya."
  [[story.pages]]
  image = "eco-idol"
  heading = "Greener pujas"
  text = "Unbaked clay and natural colours, and immersion in artificial ponds, keep rivers cleaner."
  link = "durga-puja/eco-friendly-puja/"
  [[story.pages]]
  image = "kumartuli"
  heading = "Visit"
  text = "The month before the puja is the best time to go. Mornings are calmer; these are workplaces, so ask before you photograph."

