  [[story.pages]]
  image = "conch"
  kicker = "Step 5"
  heading = "Aarti"
  text = "Wave the lit lamp, incense and a conch of water before the goddess while the family sings or claps."
  [[story.pages]]
  image = "pushpanjali"
  kicker = "Ashtami"
  heading = "Pushpanjali"
  text = "On Ashtami morning, offer flowers with the anjali mantras, three times."
  link = "durga-puja/rituals/pushpanjali-mantra/"
  [[story.pages]]
  image = "bhog"
  kicker = "Last step"
