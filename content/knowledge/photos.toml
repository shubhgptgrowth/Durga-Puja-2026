# Photos for the knowledge articles, from Wikimedia Commons (free licences only: CC0, public domain, CC BY, CC BY-SA).
#
# Each [key] is one photo. `q` are Commons searches used to find candidates; `file` is the chosen Commons file;
# `caption` is shown under the photo (and is its alt text). Articles use photos by key:
#   image = "key"              (front matter) the photo at the top of the article, and its share preview
#   images = ["key", "key"]    (front matter) photos placed between sections as the article goes on
#
# Workflow (Actions → article-photos):
#   mode=candidates   numbered contact sheets for keys with no `file` yet → data/photo_candidates/<key>.jpg (+ .json)
#   mode=pandals      contact sheets of the guide's own pandal photos (app/data/guide.json)
#   mode=fetch        downloads every chosen `file` → app/img/guide/<key>.webp (1200 px) and <key>-600.webp,
#                     credits → app/img/guide/photos.json; removes data/photo_candidates

