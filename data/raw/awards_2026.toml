# Puja awards, shown on /guide/award-winning-pandals-2026/, on each winner's pandal page and as a badge in the app.
# Add the 2026 winners the day each award announces them (usually around Panchami), with the link you read them in.
# Only pandals that are in the guide (data/raw/pandals.csv) can be listed; facts only, from the award's own site
# or a news report.

[[award]]
id = "apss"
name = "Asian Paints Sharad Shamman"
short = "Sharad Shamman"
url = "https://sharadshamman.asianpaints.com/winners.htm"
announce = "Asian Paints usually announces its winners during the pujas, around Panchami and Shashthi."

[[award]]
id = "bbss"
name = "Biswa Bangla Sharad Samman"
short = "Biswa Bangla"
url = "https://icad.wb.gov.in/awards-and-sammans.php"
announce = "The West Bengal government's awards; the winners are announced during the pujas."

