name: marketing-batch

# Posts reels, video stories and carousels to Instagram (marketing/publish_batch.py), with the same IG_USER_ID /
# IG_ACCESS_TOKEN secrets as marketing-publish. Two ways to run it:
#   date + window: the day's set from the reels factory (/kit/reels/<date>/manifest.json), each item at its IST slot.
#     A Claude Routine dispatches the am window (slots before 17:00) and the pm window daily; GitHub's own cron was
#     hours late. It posts only when the date is in marketing/daily/approved.txt.
#   manifest: a hand-picked batch file from marketing/batches/, spaced by gap.
# Nothing posts unless the repository variable IG_AUTOPUBLISH is "true" and dry_run is false.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Daily set to post (YYYY-MM-DD, IST). Empty = use manifest"
        default: ""
      window:
        description: "With date: am (slots before 17:00), pm, or all"
        default: "all"
      manifest:
        description: "Batch file (when date is empty)"
        default: "marketing/batches/2026-10-04.json"
      start:
        description: "Start at item (1-based; use the number a failed run printed)"
        default: "1"
      count:
        description: "How many items (0 = all remaining)"
        default: "0"
      gap:
        description: "Seconds between posts (daily sets: minimum gap after a late post)"
        default: "300"
      dry_run:
        description: "Only check the files and print what would be posted"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: marketing-publish
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Post to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          if [ -n "${{ inputs.date }}" ]; then
            args=(--date "${{ inputs.date }}" --window "${{ inputs.window }}" --start "${{ inputs.start }}" --count "${{ inputs.count }}" --gap "${{ inputs.gap }}")
          else
            args=("${{ inputs.manifest }}" --start "${{ inputs.start }}" --count "${{ inputs.count }}" --gap "${{ inputs.gap }}")
          fi
          if [ "${{ vars.IG_AUTOPUBLISH }}" != true ] || [ "${{ inputs.dry_run }}" != false ]; then args+=(--dry-run); fi
          python -m marketing.publish_batch "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
