name: marketing-batch

# Posts a hand-picked batch of reels and carousels to Instagram, spaced out (marketing/publish_batch.py).
# Uses the same IG_USER_ID / IG_ACCESS_TOKEN secrets as marketing-publish. Scheduled runs post
# marketing/batches/<today IST>.json if it exists, only when the repository variables IG_AUTOPUBLISH and
# IG_BATCH_AUTOPUBLISH are both "true" (the second one switches the 11–21 Oct reel schedule on separately).
on:
  schedule:
    - cron: "15 13 11-21 10 *"     # 18:45 IST, 11–21 Oct: that day's reel
  workflow_dispatch:
    inputs:
      manifest:
        description: "Batch file"
        default: "marketing/batches/2026-10-04.json"
      start:
        description: "Start at item (1-based; use the number a failed run printed)"
        default: "1"
      count:
        description: "How many items (0 = all remaining)"
        default: "0"
      gap:
        description: "Seconds between posts"
        default: "300"
      dry_run:
        description: "Only check the files and print what would be posted"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: marketing-publish
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Post batch to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = schedule ]; then
            m=marketing/batches/$(TZ=Asia/Kolkata date +%F).json
            [ -f "$m" ] || { echo "No batch for today ($m)."; exit 0; }
            args=("$m" --gap 300)
            [ "${{ vars.IG_AUTOPUBLISH }}" = true ] && [ "${{ vars.IG_BATCH_AUTOPUBLISH }}" = true ] || args+=(--dry-run)
          else
            args=("${{ inputs.manifest }}" --start "${{ inputs.start }}" --count "${{ inputs.count }}" --gap "${{ inputs.gap }}")
            [ "${{ inputs.dry_run }}" = true ] && args+=(--dry-run)
          fi
          python -m marketing.publish_batch "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
