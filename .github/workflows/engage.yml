name: engage

# Daily engagement brief and approved comment replies (marketing/engage.py). Dispatched by the Claude Routine that
# writes the brief; never on a GitHub schedule.
#   mode=scan   read-only: unanswered comments on our posts + new posts from marketing/engage/creators.json,
#               committed to the engage-data branch as <date>.json (no deploy is triggered)
#   mode=reply  posts the approved replies in marketing/engage/replies/<date>.json (skips any already answered)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "scan or reply"
        default: scan
      date:
        description: "YYYY-MM-DD (default: today, IST)"
        default: ""
      dry_run:
        description: "reply mode: only print"
        type: boolean
        default: true

permissions:
  contents: write   # scan results go to the engage-data branch

concurrency:
  group: marketing-publish   # never at the same moment as a post
  cancel-in-progress: false

jobs:
  engage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          d="${{ inputs.date }}"; [ -n "$d" ] || d=$(TZ=Asia/Kolkata date +%F)
          echo "DAY=$d" >> "$GITHUB_ENV"
          if [ "${{ inputs.mode }}" = reply ]; then
            args=(); [ "${{ inputs.dry_run }}" != false ] && args+=(--dry-run)
            python -m marketing.engage reply "marketing/engage/replies/$d.json" "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python -m marketing.engage scan --out "/tmp/engage/$d.json" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save the scan (engage-data branch)
        if: inputs.mode != 'reply'
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin engage-data && git checkout engage-data || git checkout --orphan engage-data
          git rm -rq --cached . 2>/dev/null || true
          cp "/tmp/engage/$DAY.json" "$DAY.json"
          git add "$DAY.json" && git commit -qm "engage scan $DAY" && git push -q origin HEAD:engage-data
