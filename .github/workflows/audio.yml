name: audio
# Freely licensed pujo sounds from Wikimedia Commons. scout: list candidates. get: cut/encode into app/audio and commit.
on:
  workflow_dispatch:
    inputs:
      mode: { description: 'scout or get', default: 'scout' }
      spec: { description: '"File:X|start|secs|out;…" for get', default: '' }
permissions: { contents: write }
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: python3 scripts/audio_fetch.py "${{ inputs.mode }}" "${{ inputs.spec }}"
      - if: inputs.mode == 'get'
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/audio && git commit -m "Pujo sounds from Wikimedia Commons" && git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}
