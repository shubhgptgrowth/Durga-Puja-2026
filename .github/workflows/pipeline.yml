name: pipeline

on:
  push:
    paths: ["data/**", "pipeline/**", "tests/**", "app/**", "supabase/**", "package*.json", ".github/workflows/pipeline.yml"]
  pull_request:

jobs:
  data:
    name: Data pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate raw data
        run: python -m pipeline --check
      - name: Build bundle
        run: python -m pipeline
      - name: Bundle is up to date
        # The committed app/data/guide.json must match the raw CSVs. Timestamps are ignored.
        run: |
          python - <<'PY'
          import json, subprocess
          committed = json.loads(subprocess.check_output(["git", "show", "HEAD:app/data/guide.json"]))
          built = json.load(open("app/data/guide.json"))
          assert committed["meta"]["version"] == built["meta"]["version"], (
              "app/data/guide.json is stale. Run `python -m pipeline` and commit the result.")
          print("bundle version", built["meta"]["version"], "OK")
          PY
      - name: Supabase seed is up to date
        run: git diff --exit-code -- supabase/seed.sql app/data/guide.geojson
      - uses: actions/upload-artifact@v4
        with:
          name: guide-bundle
          path: app/data/

  app:
    name: App (JS unit + mobile e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - name: JS unit tests (core maths, parity with the pipeline, i18n coverage)
        run: npm run test:js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Mobile smoke test
        run: npm run test:e2e -- screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-screenshots
          path: screenshots/
      - name: Content kit builds and renders (cards, QR posters, flyer)
        run: |
          python -m marketing.kit --out kit-preview
          node marketing/render.mjs kit-preview
          test -s kit-preview/posters.pdf && test -s kit-preview/flyer.png
          ls kit-preview/2026-10-11/*.jpg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-kit-preview
          path: kit-preview/

  community:
    name: Community backend (SQL rules + real Supabase e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: SQL rule tests on plain Postgres
        run: tests/sql/run.sh
      # Straight from the latest release download (no GitHub API call, so no API rate limit to trip over)
      - name: Install Supabase CLI
        run: |
          curl -fsSL --retry 3 https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | sudo tar xz -C /usr/local/bin supabase
          supabase --version
      - name: Start local Supabase (migrations + seed)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Mobile e2e against the real Supabase stack
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}"
          npm run test:e2e -- screenshots-real
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-screenshots-real-backend
          path: screenshots-real/
