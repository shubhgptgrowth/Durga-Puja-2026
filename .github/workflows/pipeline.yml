name: pipeline

on:
  push:
    paths: ["data/**", "pipeline/**", "tests/**", "app/**", "package*.json", ".github/workflows/pipeline.yml"]
  pull_request:

jobs:
  data:
    name: Data pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate raw data
        run: python -m pipeline --check
      - name: Build bundle
        run: python -m pipeline
      - name: Bundle is up to date
        # The committed app/data/guide.json must match the raw CSVs. Timestamps are ignored.
        run: |
          python - <<'PY'
          import json, subprocess
          committed = json.loads(subprocess.check_output(["git", "show", "HEAD:app/data/guide.json"]))
          built = json.load(open("app/data/guide.json"))
          assert committed["meta"]["version"] == built["meta"]["version"], (
              "app/data/guide.json is stale. Run `python -m pipeline` and commit the result.")
          print("bundle version", built["meta"]["version"], "OK")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: guide-bundle
          path: app/data/

  app:
    name: App (JS unit + mobile e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - name: JS unit tests (core maths, parity with the pipeline, i18n coverage)
        run: npm run test:js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Mobile smoke test
        run: npm run test:e2e -- screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-screenshots
          path: screenshots/
