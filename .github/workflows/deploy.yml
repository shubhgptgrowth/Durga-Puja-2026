name: deploy

# Publishes app/ to GitHub Pages (free tier) on every push to the default branch.
# The site is fully static, and all its paths are relative, so it works under /<repo>/.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests and data validation gate the deploy
        run: |
          python -m unittest discover -s tests
          python -m pipeline --check
      # Pages must be switched on once by a repo admin (Settings → Pages → Source: GitHub Actions).
      # The workflow token can't create the Pages site itself.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
