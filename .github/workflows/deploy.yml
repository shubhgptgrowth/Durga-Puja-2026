name: deploy

# Publishes app/ to GitHub Pages (free tier) on every push to the default branch.
# The site is fully static, and all its paths are relative, so it works under /<repo>/.
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"          # 05:45 IST every day: fresh content kit at /kit/
    - cron: "30 10 16-21 10 *"    # 16:00 IST, Panchami–Dashami: live "trending now" cards

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # pull the reels factory's and footage scan's artifacts into /kit/reels/

# One deploy at a time per branch. Pushes to other branches (whose deploy is skipped) must not cancel
# a running deploy of the default branch.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false   # let a running deploy finish; the newest push waits and deploys next (pushes come every few minutes)

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.seo.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests and data validation gate the deploy
        run: |
          python -m unittest discover -s tests
          python -m pipeline --check
          python scripts/site.py check
      - name: Guide narration, shard 0 (recorded by the narrate workflow)
        uses: actions/cache/restore@v4
        with: { path: narration, key: 'narration-s0-none', restore-keys: 'narration-s0-' }
      - name: Guide narration, shard 1 (recorded by the narrate workflow)
        uses: actions/cache/restore@v4
        with: { path: narration, key: 'narration-s1-none', restore-keys: 'narration-s1-' }
      - name: Guide narration, shard 2 (recorded by the narrate workflow)
        uses: actions/cache/restore@v4
        with: { path: narration, key: 'narration-s2-none', restore-keys: 'narration-s2-' }
      - name: Guide narration, shard 3 (recorded by the narrate workflow)
        uses: actions/cache/restore@v4
        with: { path: narration, key: 'narration-s3-none', restore-keys: 'narration-s3-' }
      - name: Copy guide narration into the site
        run: |
          if [ -d narration ]; then mkdir -p app/audio/guides && cp -r narration/. app/audio/guides/ && echo "narration: $(find narration -name narration.mp3 | wc -l) pages, $(du -sh narration | cut -f1)"; else echo "no narration cached yet: run the narrate workflow"; fi
      # Crawlable guide pages, sitemap, robots.txt and llms.txt for search and AI answer engines (docs/product/SEO.md)
      - name: Guide pages for search and AI crawlers
        id: seo
        run: |
          pip install -q pillow   # share cards (og/…/card.jpg): each article's photo with its title
          python scripts/build_seo.py --out app
          # Photo stories are AMP Web Stories; Google ignores invalid ones, so flag problems (scripts/story_check.mjs)
          npx -y amphtml-validator app/stories/*/index.html || echo "::warning::A photo story is not valid AMP; run the story-check workflow"
          # Pages that changed since the live build (by content hash), for IndexNow after the deploy
          site=$(python -c "import json;print(json.load(open('site.json'))['url'])")
          curl -fsS "${site}seo-manifest.json?cb=$RANDOM" -o /tmp/live-manifest.json || echo '{}' > /tmp/live-manifest.json
          python - <<'PY' > /tmp/changed.txt
          import json
          try:
              old = json.load(open("/tmp/live-manifest.json"))
          except ValueError:
              old = {}
          new = json.load(open("app/seo-manifest.json"))
          print("\n".join(u for u, h in new.items() if old.get(u) != h))
          PY
          echo "changed pages: $(grep -c . /tmp/changed.txt || true)"
          { echo 'changed<<EOF_URLS'; cat /tmp/changed.txt; echo 'EOF_URLS'; } >> "$GITHUB_OUTPUT"
      # The marketing content kit (docs/marketing/PLAN.md) is published at /kit/. It never blocks the app deploy.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Self-hosted vector base map (docs/product/MAPS.md). Rebuilt weekly from the latest Protomaps build.
      # If it can't be built or doesn't render, app/tiles is removed and the app falls back to raster tiles.
      - name: Map tile cache key
        id: tiles
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: app/tiles
          key: tiles-${{ hashFiles('scripts/build_tiles.sh') }}-${{ steps.tiles.outputs.week }}
          restore-keys: tiles-${{ hashFiles('scripts/build_tiles.sh') }}-
      - name: Vector base map (app/tiles)
        run: |
          if scripts/build_tiles.sh app/tiles && node tests/e2e/map_tiles.mjs map-check; then
            echo "::notice::Vector map: $(cat app/tiles/kolkata.json)"
          else
            echo "::warning::Vector map unavailable this deploy (see the step log); the app falls back to raster tiles."
            rm -f app/tiles/*.pmtiles && git checkout -- app/tiles/kolkata.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-check
          path: map-check/
          if-no-files-found: ignore
      - name: Content kit (/kit/) and link preview image
        continue-on-error: true
        run: |
          url=$(sed -n "s/.*url: '\([^']*\)'.*/\1/p" app/config.js | head -1)
          key=$(sed -n "s/.*anonKey: '\([^']*\)'.*/\1/p" app/config.js | head -1)
          if [ -n "$url" ]; then curl -fsS -H "apikey: $key" "$url/rest/v1/place_stats?select=place_id,visits,today" -o /tmp/stats.json || rm -f /tmp/stats.json; fi
          python -m marketing.kit --out app/kit --stats /tmp/stats.json
          node marketing/render.mjs app/kit
          node marketing/render.mjs --og app/icons
          # Instagram carousels at /kit/carousels/ (marketing/carousels.py), which marketing-batch posts from.
          pip install -q pillow && python -m marketing.carousels --out app/kit/carousels --photos && node marketing/carousels.mjs app/kit/carousels \
            || echo "::warning::Carousels not rendered"
      - name: Daily reels and footage catalogue (/kit/reels/)
        # Rendered by reels-factory / footage-scan (marketing/footage/). Yesterday to 6 days ahead are kept (review ahead); a newer
        # render of a date replaces the older one. Never blocks the app deploy.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/kit/reels /tmp/reels app/kit/review
          # Content review page (marketing/review/) with the Wave 1 slides it shows
          cp marketing/review/index.html app/kit/review/index.html
          curl -fsSL -o /tmp/wave1.zip https://d2ol7oe51mr4n9.cloudfront.net/user_3C4ckPluFiRw2Fro30FUIlIR0V7/467c1e0f-c609-44b3-bc42-8c60a8e81f80.zip \
            && unzip -qo /tmp/wave1.zip -d app/kit/review/wave1 || echo "::warning::Wave 1 slides not downloaded"
          keep=$(for k in -1 0 1 2 3 4 5 6; do TZ=Asia/Kolkata date -d "$k day" +%F; done)
          # Every page: other workflows' artifacts can push a day's render out of the newest 100 (8 Oct went missing so)
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.expired | not) and (.name | startswith("reels-"))) | "\(.created_at) \(.workflow_run.id) \(.name)"' |
          sort | cut -d' ' -f2- |
          while read -r id name; do
            gh run download "$id" -n "$name" -D "/tmp/reels/$name" || continue
            for d in $keep; do
              if [ -d "/tmp/reels/$name/$d" ]; then rm -rf "app/kit/reels/$d"; cp -r "/tmp/reels/$name/$d" "app/kit/reels/$d"; fi
            done
          done
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=footage-catalog&per_page=1" --jq '.artifacts[0].workflow_run.id // empty')
          if [ -n "$id" ]; then gh run download "$id" -n footage-catalog -D app/kit/reels/catalog; fi
          ls -R app/kit/reels | head -40
          # Redesign preview (preview.yml, run on a branch): newest preview-site artifact at /kit/preview/
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=preview-site&per_page=1" --jq '.artifacts[0] | select(.expired | not) | .workflow_run.id // empty')
          if [ -n "$id" ]; then gh run download "$id" -n preview-site -D app/kit/preview && echo "preview: $(ls app/kit/preview)"; fi
      # Pages must be switched on once by a repo admin (Settings → Pages → Source: GitHub Actions).
      # The workflow token can't create the Pages site itself.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  domain:
    # Keeps the GitHub Pages custom domain in step with site.json (docs/product/HOSTING.md).
    # Needs a token that can manage Pages settings; without one it prints the manual step.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pages custom domain
        env:
          GH_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN || github.token }}
        run: |
          host=$(python -c "import json,urllib.parse as u;print(u.urlparse(json.load(open('site.json'))['url']).netloc)")
          case "$host" in *.github.io) want="";; *) want="$host";; esac
          have=$(gh api "repos/${{ github.repository }}/pages" --jq '.cname // ""' 2>/dev/null || echo "?")
          echo "Pages custom domain: have '$have', want '$want'"
          [ "$have" = "$want" ] && exit 0
          if [ -n "$want" ]; then args=(-f "cname=$want"); else args=(-F "cname=null"); fi
          gh api -X PUT "repos/${{ github.repository }}/pages" "${args[@]}" \
            && echo "::notice::Pages custom domain set to '$want'" \
            || echo "::warning::Could not set the custom domain automatically. Set it in Settings → Pages → Custom domain: $want"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    # Smoke-check the live site: shell, data, service worker and manifest are served,
    # and the published guide.json is the version that was just built.
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Live site serves the current build
        run: |
          SITE=$(python -c "import json;print(json.load(open('site.json'))['url'])")
          PAGES=$(python -c "import json;print(json.load(open('site.json'))['pages_url'])")
          if [ "$SITE" != "$PAGES" ]; then
            # Custom domain: the old github.io address must redirect, so printed QR codes keep working.
            loc=$(curl -s -o /dev/null -w '%{redirect_url}' "${PAGES}?src=qr_test#p=x")
            echo "old address redirects to: $loc"
            case "$loc" in "$SITE"*) ;; *) echo "::warning::$PAGES does not redirect to $SITE yet (DNS or HTTPS still provisioning?)";; esac
          fi
          expected=$(python -c "import json;print(json.load(open('app/data/guide.json'))['meta']['version'])")
          for i in 1 2 3 4 5 6; do
            live=$(curl -fsS "${SITE}data/guide.json?cb=$RANDOM" | python -c "import json,sys;print(json.load(sys.stdin)['meta']['version'])" || true)
            [ "$live" = "$expected" ] && break
            echo "waiting for CDN ($live != $expected)"; sleep 10
          done
          [ "$live" = "$expected" ] || { echo "live data version $live != $expected"; exit 1; }
          for p in "" index.html app.js core.js i18n.js sw.js manifest.webmanifest vendor/leaflet/leaflet.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${SITE}${p}")
            echo "$code /${p}"; [ "$code" = 200 ] || exit 1
          done
          curl -fsS "$SITE" | grep -q '<title>[^<]*Pujo Parikrama</title>'
          echo "Live: $SITE (data v$expected)"
          file=$(curl -fsS "${SITE}tiles/kolkata.json?cb=$RANDOM" | python -c "import json,sys;print(json.load(sys.stdin).get('file') or '')" || true)
          if [ -n "$file" ]; then
            code=$(curl -s -o /tmp/head.bin -w '%{http_code}' -H 'Range: bytes=0-6' "${SITE}tiles/$file")
            echo "vector tiles: $file → HTTP $code, magic $(head -c 7 /tmp/head.bin)"
            [ "$code" = 206 ] && [ "$(head -c 7 /tmp/head.bin)" = PMTiles ] || { echo "::error::vector tiles not served with range support"; exit 1; }
          else
            echo "::warning::No vector tiles published; the map is on raster tiles."
          fi
          # Crawlable guide: sitemap, robots, llms.txt, the hub and one pandal page, with its structured data
          key=$(python -c "import json;print(json.load(open('site.json')).get('indexnow_key',''))")
          for p in sitemap.xml robots.txt llms.txt llms-full.txt durga-puja/ durga-puja/index.md durga-puja/rituals/ navratri/ ${key:+$key.txt} guide/ guide/dates/ "guide/pandals/$(python -c "import json;print(json.load(open('app/data/guide.json'))['pandals'][0]['id'])")/"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${SITE}${p}?cb=$RANDOM")
            echo "$code /${p}"; [ "$code" = 200 ] || { echo "::error::/${p} not served"; exit 1; }
          done
          curl -fsS "${SITE}guide/" | grep -q 'application/ld+json' || { echo "::error::guide hub has no structured data"; exit 1; }
          curl -fsS "$SITE" | grep -q 'id="seo-static"' || { echo "::error::home page has no static summary for crawlers"; exit 1; }
          echo "::notice::Guide for crawlers: ${SITE}guide/ · sitemap ${SITE}sitemap.xml"
          kit=$(curl -s -o /dev/null -w '%{http_code}' "${SITE}kit/index.html?cb=$RANDOM")
          if [ "$kit" = 200 ]; then echo "::notice::Content kit: ${SITE}kit/"; else echo "::warning::Content kit not published ($kit)"; fi
      - name: Live site reaches the community backend (read-only)
        run: |
          SITE=$(python -c "import json;print(json.load(open('site.json'))['url'])")
          cfg=$(curl -fsS "${SITE}config.js?cb=$RANDOM")
          url=$(echo "$cfg" | sed -n "s/.*url: '\([^']*\)'.*/\1/p" | head -1)
          key=$(echo "$cfg" | sed -n "s/.*anonKey: '\([^']*\)'.*/\1/p" | head -1)
          if [ -z "$url" ]; then echo "Community backend not configured; skipping."; exit 0; fi
          n=$(curl -fsS -H "apikey: $key" "$url/rest/v1/place_stats?select=place_id" | python -c "import json,sys; print(len(json.load(sys.stdin)))")
          expected=$(python -c "import json; g=json.load(open('app/data/guide.json')); print(len(g['pandals'])+len(g['food']))")
          echo "place_stats via live config: $n rows (expected $expected)"
          [ "$n" = "$expected" ] || { echo "::error::Supabase places out of sync with the app. Re-run supabase-setup."; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS -H "Origin: $(python -c "import json,urllib.parse as u;p=u.urlparse(json.load(open('site.json'))['url']);print(p.scheme+'://'+p.netloc)")" \
            -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: apikey,authorization,content-type" "$url/rest/v1/rpc/record_visit")
          echo "CORS preflight from the site origin: $code"; [ "${code:0:1}" = 2 ] || exit 1
      - name: Tell IndexNow (Bing, ChatGPT search, Copilot, Yandex…) which pages changed
        continue-on-error: true
        env:
          CHANGED: ${{ needs.build.outputs.changed }}
        run: |
          key=$(python -c "import json;print(json.load(open('site.json')).get('indexnow_key',''))")
          [ -n "$key" ] && [ -n "$CHANGED" ] || { echo "Nothing to announce."; exit 0; }
          python - "$key" <<'PY' > /tmp/indexnow.json
          import json, os, sys, urllib.parse
          site = json.load(open("site.json"))["url"]
          urls = [u for u in os.environ["CHANGED"].split() if u.startswith(site)][:10000]
          print(json.dumps({"host": urllib.parse.urlparse(site).netloc, "key": sys.argv[1], "keyLocation": f"{site}{sys.argv[1]}.txt", "urlList": urls}))
          PY
          n=$(python -c "import json;print(len(json.load(open('/tmp/indexnow.json'))['urlList']))")
          # A new key file is verified a little after it goes live (403 SiteVerificationNotCompleted): retry for a few minutes
          for wait in 0 30 60 120; do
            sleep $wait
            code=$(curl -s -o /tmp/indexnow.out -w '%{http_code}' -X POST -H 'Content-Type: application/json; charset=utf-8' --data @/tmp/indexnow.json https://api.indexnow.org/indexnow)
            echo "IndexNow: $n changed URLs → HTTP $code"; cat /tmp/indexnow.out; echo
            [ "$code" = 403 ] || break
          done
          case "$code" in 200|202) echo "::notice::IndexNow told about $n changed pages";; *) echo "::warning::IndexNow returned $code";; esac
