name: supabase-setup

# One-click setup of the community backend on a hosted Supabase project (docs/product/COMMUNITY.md, steps 2–4):
#   1. turns on anonymous sign-ins
#   2. applies supabase/migrations/*.sql, then supabase/seed.sql (both are idempotent, so re-running is safe)
#   3. verifies the REST API, the seeded places and anonymous sign-in
#   4. prints the Project URL and anon key for app/config.js (both are public by design)
#   5. turns on Google sign-in when the GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET secrets are set
#      (docs/product/GOOGLE_SIGNIN.md), with account linking and the app's URL as an allowed redirect
# Needs the repository secret SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens).
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Project ref (the xxxx in xxxx.supabase.co). Leave empty if the account has only one project."
        required: false
        default: ""
      site_url:
        description: "The app's public URL (Google sign-in returns here)"
        required: false
        default: "https://shubhgptgrowth.github.io/Durga-Puja-2026/"

permissions:
  contents: write   # commits the public URL and anon key into app/config.js

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SBT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      API: https://api.supabase.com/v1
    steps:
      - uses: actions/checkout@v4

      - name: Resolve project
        id: ref
        run: |
          [ -n "$SBT" ] || { echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret first."; exit 1; }
          ref="${{ inputs.project_ref }}"
          if [ -z "$ref" ]; then
            projects=$(curl -fsS -H "Authorization: Bearer $SBT" "$API/projects")
            echo "$projects" | jq -r '.[] | "  \(.ref)  \(.name)  (\(.region))"'
            [ "$(echo "$projects" | jq length)" = 1 ] || { echo "::error::Several projects found; re-run with project_ref set."; exit 1; }
            ref=$(echo "$projects" | jq -r '.[0].ref')
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Using project $ref"

      - name: Enable anonymous sign-ins
        run: |
          curl -fsS -X PATCH -H "Authorization: Bearer $SBT" -H "Content-Type: application/json" \
            -d '{"external_anonymous_users_enabled": true}' "$API/projects/${{ steps.ref.outputs.ref }}/config/auth" \
            | jq '{external_anonymous_users_enabled}'

      - name: Google sign-in
        env:
          GID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GSECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SITE: ${{ inputs.site_url || 'https://shubhgptgrowth.github.io/Durga-Puja-2026/' }}
        run: |
          if [ -z "$GID" ] || [ -z "$GSECRET" ]; then
            echo "Google sign-in: skipped (add the GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET secrets to turn it on)"; exit 0
          fi
          ref=${{ steps.ref.outputs.ref }}
          cur=$(curl -fsS -H "Authorization: Bearer $SBT" "$API/projects/$ref/config/auth")
          allow=$(echo "$cur" | jq -r --arg s "${SITE%/}/**" '((.uri_allow_list // "") | split(",") | map(select(length > 0))) + [$s] | unique | join(",")')
          site=$(echo "$cur" | jq -r '.site_url // ""')
          case "$site" in ""|*localhost*|*127.0.0.1*) site="$SITE";; esac
          jq -n --arg id "$GID" --arg sec "$GSECRET" --arg allow "$allow" --arg site "$site" \
            '{external_google_enabled: true, external_google_client_id: $id, external_google_secret: $sec,
              security_manual_linking_enabled: true, uri_allow_list: $allow, site_url: $site}' > /tmp/g.json
          curl -fsS -X PATCH -H "Authorization: Bearer $SBT" -H "Content-Type: application/json" --data @/tmp/g.json \
            "$API/projects/$ref/config/auth" | jq '{external_google_enabled, security_manual_linking_enabled, site_url, uri_allow_list}'
          rm -f /tmp/g.json
          {
            echo "### Google sign-in is on"
            echo ""
            echo "In Google Cloud → Credentials → your OAuth client, the authorised redirect URI must be:"
            echo "\`https://$ref.supabase.co/auth/v1/callback\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply migrations and seed
        run: |
          run_sql() {
            echo "→ $1"
            jq -Rs '{query: .}' "$1" > /tmp/q.json
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST -H "Authorization: Bearer $SBT" -H "Content-Type: application/json" \
              --data @/tmp/q.json "$API/projects/${{ steps.ref.outputs.ref }}/database/query")
            if [ "${code:0:1}" != 2 ]; then echo "::error::$1 failed ($code)"; cat /tmp/out.json; exit 1; fi
          }
          for f in supabase/migrations/*.sql; do run_sql "$f"; done
          run_sql supabase/seed.sql

      - name: Fetch keys and verify
        run: |
          ref=${{ steps.ref.outputs.ref }}; url="https://$ref.supabase.co"
          keys=$(curl -fsS -H "Authorization: Bearer $SBT" "$API/projects/$ref/api-keys?reveal=true")
          anon=$(echo "$keys" | jq -r '[.[] | select(.name == "anon" or .type == "publishable")][0].api_key')
          [ -n "$anon" ] && [ "$anon" != null ] || { echo "::error::No anon/publishable key found"; exit 1; }
          places=$(curl -fsS -H "apikey: $anon" "$url/rest/v1/place_stats?select=place_id" | jq length)
          expected=$(jq '(.pandals | length) + (.food | length)' app/data/guide.json)
          echo "place_stats rows: $places (expected $expected)"
          [ "$places" = "$expected" ] || { echo "::error::seed mismatch"; exit 1; }
          curl -fsS -X POST -H "apikey: $anon" -H "Content-Type: application/json" -d '{"data":{}}' "$url/auth/v1/signup" \
            | jq -e '.access_token and .user.is_anonymous' >/dev/null || { echo "::error::anonymous sign-in failed"; exit 1; }
          echo "anonymous sign-in OK"
          echo "Google sign-in: $(curl -fsS -H "apikey: $anon" "$url/auth/v1/settings" | jq -r '.external.google')"
          bucket=$(curl -fsS -H "Authorization: Bearer $SBT" -H "Content-Type: application/json" \
            -d '{"query":"select public from storage.buckets where id = '"'"'moments'"'"'"}' "$API/projects/$ref/database/query")
          echo "moments bucket: $bucket"
          {
            echo "### Community backend is ready"
            echo ""
            echo "Put these in \`app/config.js\` → \`community\` (both are public by design):"
            echo ""
            echo '```js'
            echo "url: '$url',"
            echo "anonKey: '$anon',"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "CONFIG_URL=$url"
          echo "CONFIG_ANON_KEY=$anon"

      - name: Write app/config.js and commit
        run: |
          ref=${{ steps.ref.outputs.ref }}; url="https://$ref.supabase.co"
          anon=$(curl -fsS -H "Authorization: Bearer $SBT" "$API/projects/$ref/api-keys?reveal=true" | jq -r '[.[] | select(.name == "anon" or .type == "publishable")][0].api_key')
          python3 - "$url" "$anon" <<'PY'
          import re, sys
          url, key = sys.argv[1], sys.argv[2]
          p = "app/config.js"; s = open(p).read()
          s = re.sub(r"url: '[^']*',(\s*// e\.g\.[^\n]*)?", f"url: '{url}',", s, count=1)
          s = re.sub(r"anonKey: '[^']*',[^\n]*", f"anonKey: '{key}',  // public by design; RLS + RPCs enforce the rules", s, count=1)
          open(p, "w").write(s)
          PY
          if git diff --quiet -- app/config.js; then echo "config.js already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Connect the community backend (Supabase $ref)" -- app/config.js
          git push origin HEAD:${{ github.ref_name }}
