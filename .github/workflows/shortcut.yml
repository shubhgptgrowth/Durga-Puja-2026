name: shortcut

# Builds the "Pujo steps" iPhone Shortcut (scripts/make_shortcut.py) and tries to sign it. iOS only imports
# signed shortcuts, and `shortcuts sign` needs a Mac signed into iCloud, which GitHub's runners are not.
# So this usually ends with the unsigned file attached to the run; sign it on any Mac with
# scripts/sign_shortcut.sh (docs/product/IPHONE_SHORTCUT.md). If signing works, the file is committed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: python3 scripts/make_shortcut.py "$RUNNER_TEMP/unsigned.shortcut"
      - uses: actions/upload-artifact@v4
        with:
          name: pujo-steps-unsigned
          path: ${{ runner.temp }}/unsigned.shortcut
      - name: Sign
        continue-on-error: true
        id: sign
        run: |
          sw_vers
          mkdir -p app/shortcut
          shortcuts sign --mode anyone --input "$RUNNER_TEMP/unsigned.shortcut" --output app/shortcut/pujo-steps.shortcut
          ls -la app/shortcut
      - name: Commit
        if: steps.sign.outcome == 'success'
        run: |
          git add app/shortcut
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Signed iPhone Shortcut: Pujo steps"
          git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}
