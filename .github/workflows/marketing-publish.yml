name: marketing-publish

# Optional Instagram auto-posting of the day's kit cards (docs/marketing/PLAN.md → "Instagram auto-posting").
# Off by default: runs only post when the repository variable IG_AUTOPUBLISH is "true" (the kill switch), the
# IG_USER_ID / IG_ACCESS_TOKEN secrets exist and dry_run is false. Otherwise they print what they would post.
# No GitHub cron: its scheduled runs started up to 8.5 h late (and some days not at all), so the daily run is
# dispatched at 08:05 IST by a Claude Routine instead, right after it re-deploys the kit. publish_ig skips a day
# that is already on the account, so a repeated dispatch never double-posts.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Kit day (YYYY-MM-DD). Empty = today (IST)"
        default: ""
      only:
        description: "post, story, or empty for both"
        default: ""
      dry_run:
        description: "Only print what would be posted"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: marketing-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Post to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          set -o pipefail  # a failed post must fail the run, not hide behind tee
          args=()
          [ -n "${{ inputs.date }}" ] && args+=(--date "${{ inputs.date }}")
          [ -n "${{ inputs.only }}" ] && args+=(--only "${{ inputs.only }}")
          if [ "${{ vars.IG_AUTOPUBLISH }}" != true ] || [ "${{ inputs.dry_run }}" != false ]; then args+=(--dry-run); fi
          python -m marketing.publish_ig "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
