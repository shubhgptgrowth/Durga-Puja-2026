name: reels-factory

# Renders a day's reels and video stories from its plan (marketing/daily/<date>.json, marketing/footage/factory.py)
# and has deploy publish them, with a review page, at /kit/reels/<date>/. Runs when a plan changes on the default
# branch, or by hand for one date. Posting is separate (marketing-batch) and needs the day in approved.txt.
on:
  push:
    paths: ["marketing/daily/2*.json"]
  workflow_dispatch:
    inputs:
      date:
        description: "Plan date (YYYY-MM-DD)"
        required: true

permissions:
  contents: read
  actions: write   # download the footage catalogue artifact and start deploy

concurrency:
  # one queue per branch: a plan pushed on a work branch (whose run is skipped) must not bump a pending render
  # on the default branch out of the queue
  group: reels-factory-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  render:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tools and fonts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libfribidi0 libraqm0 >/dev/null
          pip install -q pillow edge-tts
          python -c "from PIL import features; assert features.check('raqm'), 'Pillow without raqm: Bengali would not shape'"
          mkdir -p fonts
          for w in ExtraBold Bold SemiBold Medium; do curl -fsSLo fonts/Poppins-$w.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$w.ttf; done
          curl -fsSLo fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf
          for f in galada/Galada-Regular hindsiliguri/HindSiliguri-Bold; do curl -fsSLo fonts/${f#*/}.ttf https://github.com/google/fonts/raw/main/ofl/$f.ttf; done
          # the cinematic look's serif faces; without them the reels fall back to the house faces
          for f in marcellus/Marcellus-Regular tirobangla/TiroBangla-Regular tirodevanagarisanskrit/TiroDevanagariSanskrit-Regular \
                   hindsiliguri/HindSiliguri-Regular poppins/Poppins-Regular; do
            curl -fsSLo fonts/${f#*/}.ttf https://github.com/google/fonts/raw/main/ofl/$f.ttf || echo "::warning::font $f missing"
          done
          # editorial carousels' display face (variable font; the renderer sets the weight)
          for f in "CormorantGaramond[wght]" "CormorantGaramond-Italic[wght]"; do
            u=$(printf '%s' "$f" | sed 's/\[/%5B/; s/\]/%5D/')
            curl -fsSLo "fonts/$f.ttf" "https://github.com/google/fonts/raw/main/ofl/cormorantgaramond/$u.ttf" || echo "::warning::font $f missing"
          done
      - name: Which dates
        id: dates
        run: |
          if [ -n "${{ inputs.date }}" ]; then d="${{ inputs.date }}"
          else d=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'marketing/daily/2*.json' | sed 's#.*/##; s#\.json$##' | tr '\n' ' '); fi
          echo "dates=$d" >> "$GITHUB_OUTPUT"; echo "dates: $d"
      - name: Footage catalogue
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=footage-catalog&per_page=1" --jq '.artifacts[0].workflow_run.id // empty')
          if [ -n "$id" ]; then gh run download "$id" -n footage-catalog -D catalog; else echo "::warning::No footage catalogue yet: only footage.json clips"; fi
      - uses: actions/cache@v4
        with:
          path: src
          key: reels-src-${{ hashFiles('marketing/daily/2*.json') }}
          restore-keys: reels-src-
      - name: Render
        run: |
          set -o pipefail   # a failed render must fail the run, not hide behind tee
          for d in ${{ steps.dates.outputs.dates }}; do
            [ -f "marketing/daily/$d.json" ] || continue
            python -m marketing.footage.factory "$d" --catalog catalog/catalog.json --out "out/$d" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          ls out >/dev/null 2>&1 || { echo "nothing rendered"; exit 0; }
      - uses: actions/upload-artifact@v4
        with:
          name: reels-${{ github.run_id }}   # out/<date>/…; deploy merges recent ones, newest last
          path: out/
          retention-days: 7
          if-no-files-found: ignore
      - name: Publish (deploy pulls the latest reels artifact)
        run: gh workflow run deploy.yml --ref "${{ github.event.repository.default_branch }}"
