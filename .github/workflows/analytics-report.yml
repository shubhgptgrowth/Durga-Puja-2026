name: analytics-report

# App usage (docs/product/ANALYTICS.md): pages, places, sounds and actions, from anonymous events.
# Aggregates only. The full directory is the "analytics" schema in the Supabase dashboard.
on:
  schedule:
    - cron: "40 16 * * *"          # 22:10 IST daily
  workflow_dispatch:
    inputs:
      days:
        description: "How many days to cover"
        default: "1"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build report
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python -m marketing.analytics --days "${{ inputs.days || '1' }}" --json analytics.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: analytics-report
          path: analytics.json
          retention-days: 14
